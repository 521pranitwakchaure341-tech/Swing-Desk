name: Daily update
on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - run: python build_static.py
      - run: |
          git config user.name "swing-desk-bot"
          git config user.email "swing-desk-bot@users.noreply.github.com"
          git add state.json trades_brk.json trades_pb.json trades_mr.json data/paper.json data/universe.json
          git commit -m "Daily update" || echo "Nothing new"
          git push
